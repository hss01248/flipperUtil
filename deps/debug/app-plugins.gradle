buildscript{

     repositories {
        mavenLocal()
        maven {//google()
             url  'https://dl.google.com/dl/android/maven2/'
        }
        maven {//mavenCentral()
             url  'https://repo.maven.apache.org/maven2/'
        }
        maven {
             url  'https://jitpack.io'
        }
        maven {
             url  'https://maven.aliyun.com/repository/jcenter'
        }
        maven {
             url  'https://nexus.hss01248.tech/repository/maven-releases/'
        }
        maven {
             url  'https://maven.aliyun.com/nexus/content/groups/public/'
        }
}

//list all plugin classPath:
dependencies {
     classpath "com.android.tools.build:gradle:7.4.2"
     classpath "com.didiglobal.booster:booster-gradle-plugin:4.16.2"
     classpath "com.squareup.okhttp3:okhttp:3.12.12"
     classpath "io.github.didi.dokit:dokitx-plugin:3.7.11"
     classpath "io.github.wurensen:gradle-android-plugin-aspectjx:3.3.2"
     classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
  }
}


