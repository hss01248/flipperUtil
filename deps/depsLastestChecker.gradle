def creatDir(path){
    File file = new File(path);
    if(!file.exists()){
        file.mkdirs()
    }
}

def parseDeps(Project project) {

    //只对可运行工程操作,不care library类型的module
    if (project.plugins.findPlugin('com.android.application') == null) {
        return
    }
    println("应用deps相关任务到--->" + project.name)
    //project.apply plugin: "com.github.ben-manes.versions"
    project.apply plugin: com.dorongold.gradle.tasktree.TaskTreePlugin

    project.android.applicationVariants.all { variant ->
        println("parseDeps--->variant " + variant.name)

        tasks.create(name: "listAllDeps${project.name.capitalize()}${variant.name.capitalize()}"
                , description: "输出当前项目插件列表/依赖树/依赖列表到文件-${project.name.capitalize()}${variant.name.capitalize()}"
                , group: "deps") {
            //dependsOn project.tasks.findByPath("dependencies")
            doLast {
                //如何在这里指定输出到文件?--> 已解决,exec里指定standardOutput
                listPlugins(variant, project, it)
                listDependenciesAndCheckLastest(project, variant)
                listDepsTree(project, variant)
            }
        }
        tasks.create(name: "listAllTasks${project.name.capitalize()}${variant.name.capitalize()}"
                , description: "输出当任务树到文件-${project.name.capitalize()}${variant.name.capitalize()}"
                , group: "deps") {
            doLast {
                //如何在这里指定输出到文件?--> 已解决,exec里指定standardOutput
                listTaskTree(project, variant)
            }
        }
    }
    tasks.create(name: "checkReposRate${project.name.capitalize()}"
            , description: "测试repo连接速度并排序-${project.name.capitalize()}"
            , group: "deps") {
        doLast {
            //如何在这里指定输出到文件?--> 已解决,exec里指定standardOutput
            checkReposRate(project)

        }
    }


}

private void checkReposRate(Project project){
    Map<Integer,String> repos = new TreeMap<>();
    project.repositories.forEach(new Consumer<ArtifactRepository>() {
        @Override
        void accept(ArtifactRepository artifactRepository) {
            String url = artifactRepository.properties.get("url")
            println(artifactRepository.name + " : " + url)
            //所有配置的属性: println(artifactRepository.getProperties().toMapString() )
            //Credentials credentials = artifactRepository.getProperties().get("configuredCredentials")
           //认证属性
            if(artifactRepository.getProperties() == null || artifactRepository.getProperties().get("configuredCredentials") == null){
                return
            }
            Map map = artifactRepository.getProperties().get("configuredCredentials").properties
            //println(credentials.properties.toMapString())
            String username = map.get("username")
            String pw = map.get("password")
            if(url == null || url.startsWith("file:")){
                println("本地文件仓库:"+url+" , "+artifactRepository.properties.get("dirs"))
                return
            }
            int cost = 0;
            if(username != null && pw != null){
                //使用basicAuth访问
                 cost = checkHttpCost(url,username,pw)
            }else {
                //无需auth访问
                 cost = checkHttpCost(url,"","")
            }
            repos.put(cost,artifactRepository.name + " : " + url)
        }
    })
    println("repos rate:\n"+repos.toMapString().replaceAll(",","\n"))
}

private int checkHttpCost(String url,String username,String pw){
    long start = System.currentTimeMillis();
    try {
        OkHttpClient client = new OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).build()
        Request.Builder builder = new Request.Builder().url(url);
        if(username != null && !"".equals(username)){
            String basic = "Basic "+base64(username+":"+pw)
            builder.addHeader("Authorization",basic)
            println("Authorization:"+ basic+" , actual "+username+":"+pw)
        }
       Response response =  client.newCall(builder.build()).execute()
        println("response:"+ response.code()+" "+response.message())
    }catch(Throwable throwable){
        throwable.printStackTrace()
    }
    long cost =  System.currentTimeMillis() - start
    println("cost:"+ cost+"ms")
    println("")
    return cost
}

private String base64(String str){
    return new String(Base64.encoder.encode(str.getBytes("UTF-8")),"utf-8")
}



private void listTaskTree(Project project, variant) {
    //def task = ":${project.name}:${variant.name} taskTree"
    //def task =  project.tasks.findByName("taskTree").getPath()
    def task =  ":${project.name}:assemble"+variant.name.capitalize()
    //./gradlew :app:assembleDebug taskTree --no-repeat
    def config = [gradleCmd(),
                  //">deps/${variant.name}/${variant.name}-depesTree.txt",
                  task, "taskTree","--no-repeat"]
    //最后,生成依赖树到txt文件:
    println("---> taskpath:" + config)

    creatDir("${rootProject.projectDir}/deps/${variant.name}")
    //./gradlew :app:dependencies > ~/Desktop/output.txt


    //https://blog.csdn.net/a_zhon/article/details/113250646
    var outText = "${rootProject.projectDir}/deps/${variant.name}/${project.name}-taskTree.txt";
    println("如果taskTree命令运行失败,请在拷贝后在命令行手动运行这个命令:\n" + config.toString().replaceAll(",","")+" -->"+outText)
    def out = new TeeOutputStream(new FileOutputStream("${rootProject.projectDir}/deps/${variant.name}/${project.name}-taskTree.txt"), System.out);
    //standardOutput可以获取到命令的输出
    try {
        exec {
            // 通过命令，执行task任务
            commandLine config
            standardOutput out
            //不能使用shell里的简写:  args ">> deps/${variant.name}/${variant.name}-depesTree.txt"
        }
    } catch (Throwable throwable) {
        throwable.printStackTrace()

    }
}

private void listDependenciesAndCheckLastest(Project project, variant){
    Configuration configuration = project.configurations."${variant.name}RuntimeClasspath"
    println("parseDeps configuration--->" + configuration)
    File file = new File(rootDir, "deps/${variant.name}/${project.name}-deps.gradle");
    creatDir("${rootProject.projectDir}/deps/${variant.name}")
    if (file.exists()) {
        //file.delete();
    }
    StringBuilder sb = new StringBuilder();
    StringBuilder sn = new StringBuilder();
    sb.append("//list all deps:\ndependencies {\n")


    /*   List<String> hosts = new ArrayList<>()
       parseRepos(project.repositories,sb,hosts)*/

    sn.append("//versions contains SNAPSHOT:\ndependencies {\n")
    List<ModuleVersionIdentifier> deps = new ArrayList<>();
    //println("parseDeps allModuleDependencies--->"+configuration.resolvedConfiguration.lenientConfiguration.allModuleDependencies)
    configuration.resolvedConfiguration.lenientConfiguration.allModuleDependencies.each {
        def identifier = it.module.id
        if (!"unspecified".equals(identifier.version)) {
            deps.add(identifier)
        }
    }
    //依赖列表排序:
    Collections.sort(deps, new Comparator<ModuleVersionIdentifier>() {
        @Override
        int compare(ModuleVersionIdentifier t, ModuleVersionIdentifier t1) {
            return (t.group + t.name).compareTo(t1.group + t1.name)
        }
    })

    for (ModuleVersionIdentifier identifier : deps) {
        println("implementation \"${identifier.group}:${identifier.name}:${identifier.version}\"")
        //将依赖生成一个gradle文件
        sb.append("     implementation \"${identifier.group}:${identifier.name}:${identifier.version}\"").append("\n")
        if (identifier.version.contains("SNAPSHOT")) {
            sn.append("     implementation \"${identifier.group}:${identifier.name}:${identifier.version}\"").append("\n")
        }
    }

    List<String> hosts = new ArrayList<>()
    StringBuilder sp = new StringBuilder();
    //解析repository
    parseRepos2(project.repositories, sp, hosts)

    sn.append("}\n\n")
    sb.append("}")
    String str = sp.toString() + "\n" + sn.toString() + "\n" + sb.toString()
    //字符串写入到文件
    def osm = file.newOutputStream()
    osm.write(str.getBytes())
    osm.close()

    println("--->开始查询最新版本,最多等待30s(全部完成则提前结束)")
    List<String> infos = new ArrayList<>(deps.size())
    List<String> versions = new ArrayList<>(deps.size())
    List<Map<String, String>> beanMapList = new ArrayList<>();
    CountDownLatch versionCheckLatch = new CountDownLatch(hosts.size() * deps.size());
    checkLastest(hosts, deps, infos, versions, beanMapList, versionCheckLatch)

    long waitStart = System.currentTimeMillis()
    boolean completed = versionCheckLatch.await(30, TimeUnit.SECONDS)
    long waitedMs = System.currentTimeMillis() - waitStart
    if (!completed) {
        println("警告: 30s 内仍有未结束的版本检查请求,将按已收集结果写出文件")
    }
    Collections.sort(infos)
    Collections.sort(beanMapList, new Comparator<Map<String, String>>() {
        @Override
        int compare(Map<String, String> t, Map<String, String> t1) {
            return t.get("groupArti").compareTo(t1.get("groupArti"))
        }
    })
    File file1 = new File(rootDir, "deps/${variant.name}/${project.name}-depsLastest.gradle");
    println("版本查询结束(耗时 ${waitedMs}ms),--->写文件到: " + file1.absolutePath)
    //String strs = Arrays.toString(infos.toArray()).replaceAll("\\,","\n")


    StringBuilder builder = new StringBuilder("//all deps have updates:\ndependencies {\n")
    for (Map<String, String> t : beanMapList) {
        builder.append("\n     implementation \"" + t.get("groupArti") + ":" + t.get("version")
                + "\" // --> " + t.get("versionNew") + "\n //  url : " + t.get("url"))
    }
    builder.append("\n}")

    def osm1 = file1.newOutputStream()
    osm1.write(builder.toString().getBytes())
    osm1.close()
}

private void listDepsTree(Project project, variant) {
    creatDir("${rootProject.projectDir}/deps/${variant.name}")
    String outText = "${rootProject.projectDir}/deps/${variant.name}/${project.name}-depesTree.txt"
    String configurationName = "${variant.name}RuntimeClasspath"
    // 不再嵌套执行 gradlew :app:dependencies，避免与当前 Daemon 争抢 ~/.gradle/caches/*/fileHashes 锁。
    // 依赖解析与 listDependenciesAndCheckLastest 使用同一 Configuration，输出树状文本到文件。
    println("---> dependency tree (in-process), configuration: " + configurationName + " -> " + outText)
    Configuration configuration = project.configurations.getByName(configurationName)
    StringBuilder sb = new StringBuilder()
    sb.append("\n")
    sb.append("------------------------------------------------------------\n")
    sb.append("Project '").append(project.path).append("' - configuration '").append(configurationName).append("'\n")
    sb.append("------------------------------------------------------------\n\n")
    try {
        ResolvedConfiguration resolved = configuration.resolvedConfiguration
        Set<ResolvedDependency> firstLevel = resolved.getFirstLevelModuleDependencies()
        List<ResolvedDependency> sorted = new ArrayList<>(firstLevel)
        Collections.sort(sorted, new Comparator<ResolvedDependency>() {
            @Override
            int compare(ResolvedDependency a, ResolvedDependency b) {
                return moduleKey(a).compareTo(moduleKey(b))
            }
        })
        int i = 0
        for (ResolvedDependency dep : sorted) {
            i++
            appendResolvedDependencyTree(dep, "", i == sorted.size(), sb)
        }
        sb.append("\n")
    } catch (Throwable t) {
        sb.append("Failed to render dependency tree: ").append(t.getMessage()).append("\n")
        t.printStackTrace()
    }
    new File(outText).setText(sb.toString(), "UTF-8")
    println(sb.toString())
}

private static String moduleKey(ResolvedDependency d) {
    return d.moduleGroup + ":" + d.moduleName
}

/**
 * 与 Gradle dependencies 任务类似的 ASCII 树（仅本解析结果，不另起 JVM）。
 */
private void appendResolvedDependencyTree(ResolvedDependency dep, String prefix, boolean isLast, StringBuilder sb) {
    String branch = isLast ? "\\--- " : "+--- "
    sb.append(prefix).append(branch).append(dep.moduleGroup).append(":").append(dep.moduleName).append(":").append(dep.moduleVersion).append("\n")
    List<ResolvedDependency> children = new ArrayList<>(dep.children)
    Collections.sort(children, new Comparator<ResolvedDependency>() {
        @Override
        int compare(ResolvedDependency a, ResolvedDependency b) {
            return moduleKey(a).compareTo(moduleKey(b))
        }
    })
    for (int i = 0; i < children.size(); i++) {
        ResolvedDependency child = children.get(i)
        boolean lastChild = (i == children.size() - 1)
        String nextPrefix = prefix + (isLast ? "     " : "|    ")
        appendResolvedDependencyTree(child, nextPrefix, lastChild, sb)
    }
}

