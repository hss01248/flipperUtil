def isWindows() {
    return org.gradle.internal.os.OperatingSystem.current().isWindows()
}

def gradleCmd(){
    String gradle = "${rootProject.projectDir}/gradlew"
    if(isWindows()){
        gradle = "${rootProject.projectDir}\\gradlew.bat"
    }
    println("is windows: "+isWindows())

    return  gradle
}

/**
 * 嵌套再执行 ./gradlew 会与当前 Daemon 争抢 ~/.gradle/caches 下的文件锁（如 fileHashes）。
 * 对仍必须起子进程的任务追加 --no-daemon，降低与其它 Daemon 抢锁的概率。
 * 若仍失败：先停止其它 Gradle（勿在「当前这次构建正在跑」时盲目 kill 掉承载本构建的进程），再单独执行打印出的命令。
 */
private List<String> nestedGradleCommand(List<String> argsWithoutGradleBinary) {
    List<String> cmd = new ArrayList<>()
    cmd.add(gradleCmd())
    cmd.add("--no-daemon")
    cmd.addAll(argsWithoutGradleBinary)
    return cmd
}

