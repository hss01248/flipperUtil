import java.util.zip.ZipInputStream

/**
 * 独立脚本：检测依赖库编译用的 Java 版本
 * 使用方法：在根目录 build.gradle 编写 apply from: "check_java_version.gradle"
 */

gradle.addBuildListener(new BuildListener() {
    @Override
    void settingsEvaluated(Settings settings) {

    }

    @Override
    void projectsLoaded(Gradle gradle) {

    }

    @Override
    void projectsEvaluated(Gradle gradle) {

    }

    @Override
    void buildFinished(BuildResult result) {

    }
})

gradle.addProjectEvaluationListener(new ProjectEvaluationListener() {

    @Override
    void beforeEvaluate(Project project) {

    }

    @Override
    void afterEvaluate(Project project, ProjectState projectState) {
        println("--->afterEvaluate3:${project.name}")
        // 只对 Android 或 Java 项目添加该任务
        def isAndroid = project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')
        def isJava = project.plugins.hasPlugin('java') || project.plugins.hasPlugin('java-library')

        if (isAndroid ) {
            // 定义一个集合来存放所有的 variants
            def variants = []

            if (project.plugins.hasPlugin('com.android.application')) {
                variants = project.android.applicationVariants
            } else if (project.plugins.hasPlugin('com.android.library')) {
                variants = project.android.libraryVariants
            }
            variants.all {
                def variant = it
                project.tasks.create(name: "printJavaVersion${variant.name.capitalize()}"
                        , description: "打印当前模块第三方库的 Java 编译版本-${variant.name.capitalize()}"
                        , group: "javaVersion") {
                    doLast {
                        // 1. 优先读取命令行参数 -PtargetConfig，否则默认使用 debugRuntimeClasspath
                        def target = project.hasProperty('targetConfig') ? project.property('targetConfig') : 'debugRuntimeClasspath'
                        def variantName = variant.name.capitalize()
                        def lines = []

                        lines.add("\n" + "=".multiply(90))
                        lines.add("  模块路径: ${project.path}")
                        lines.add("  目标配置: ${target} (默认使用 debugRuntimeClasspath)")
                        lines.add("=".multiply(90))
                        lines.add(sprintf("  %-75s | %-12s | %-5s", ["Dependency Artifact", "Java Version", "Major"]))
                        lines.add("-".multiply(90))

                        def configuration = project.configurations.findByName(target)
                        if (!configuration || !configuration.canBeResolved) {
                            lines.add("  ❌ 错误: 配置 '${target}' 不存在或不可解析。")
                            lines.each { println it }
                            return
                        }

                        // 遍历解析后的成品，按 artifact moduleVersion id 去重
                        def resolvedArtifacts
                        try {
                            resolvedArtifacts = configuration.resolvedConfiguration.resolvedArtifacts
                        } catch (Exception e) {
                            lines.add("  ⚠ 配置包含本地项目依赖，尝试仅分析外部依赖...")
                            println lines[-1]
                            def extDeps = configuration.getAllDependencies().findAll {
                                !(it instanceof org.gradle.api.artifacts.ProjectDependency)
                            }
                            try {
                                def detachedConfig = project.configurations.detachedConfiguration(
                                    extDeps.toArray(new org.gradle.api.artifacts.Dependency[0])
                                )
                                resolvedArtifacts = detachedConfig.resolvedConfiguration.resolvedArtifacts
                            } catch (Exception e2) {
                                lines.add("  ❌ 无法解析: ${e2.message?.take(200)}")
                                lines.add("=".multiply(90) + "\n")
                                lines.each { println it }
                                return
                            }
                        }

                        def seen = new HashSet()
                        resolvedArtifacts.each { artifact ->
                            def id = artifact.moduleVersion.id.toString()
                            if (!seen.add(id)) return // 已输出过则跳过
                            def file = artifact.file
                            def major = -1

                            try {
                                if (file.name.endsWith(".jar")) {
                                    major = getMajorVersionFromJar(file)
                                } else if (file.name.endsWith(".aar")) {
                                    major = getMajorVersionFromAar(file)
                                }

                                if (major != -1) {
                                    def javaDesc = getJavaDesc(major)
                                    lines.add(sprintf("  %-75s | %-12s | %-5s",
                                            [id, javaDesc, major]))
                                }
                            } catch (Exception e) {
                                // 忽略无法处理的文件
                            }
                        }
                        lines.add("=".multiply(90) + "\n")

                        // 输出到控制台
                        lines.each { println it }

                        // 输出到文件 deps/<Variant>/javaVersion<project.name><Variant>
                        try {
                            def outputDir = project.rootProject.file("deps/${variantName}")
                            outputDir.mkdirs()
                            def outputFile = new File(outputDir, "${project.name}-compileJavaVersion.txt")
                            outputFile.withWriter { w ->
                                lines.each { w.writeLine(it) }
                            }
                        } catch (Exception e) {
                            println "  ⚠ 写入文件失败: ${e.message?.take(100)}"
                        }
                    }
                }
            }

        }

    }
})


// 获取 Java 版本描述映射
def getJavaDesc(int major) {
    def map = [
            45: "Java 1.1", 46: "Java 1.2", 47: "Java 1.3", 48: "Java 1.4", 49: "Java 5",
            50: "Java 6", 51: "Java 7", 52: "Java 8", 53: "Java 9", 54: "Java 10",
            55: "Java 11", 56: "Java 12", 57: "Java 13", 58: "Java 14", 59: "Java 15",
            60: "Java 16", 61: "Java 17", 62: "Java 18", 63: "Java 19", 64: "Java 20",
            65: "Java 21", 66: "Java 22"
    ]
    return map[major] ?: "Unknown"
}

// 处理 Jar 文件
def getMajorVersionFromJar(File file) {
    def zip = new ZipInputStream(new FileInputStream(file))
    return findMajorInZip(zip)
}

// 处理 Aar 文件 (解析内部 classes.jar)
def getMajorVersionFromAar(File file) {
    def aarZip = new ZipInputStream(new FileInputStream(file))
    def entry
    while ((entry = aarZip.getNextEntry()) != null) {
        if (entry.name == "classes.jar") {
            return findMajorInZip(new ZipInputStream(aarZip))
        }
    }
    return -1
}

// 读取 Zip 流中的第一个 Class 文件版本号
def findMajorInZip(ZipInputStream zis) {
    def entry
    while ((entry = zis.getNextEntry()) != null) {
        if (entry.name.endsWith(".class") && !entry.name.contains('$')) {
            DataInputStream dis = new DataInputStream(zis)
            if (dis.readInt() == (int)0xCAFEBABE) {
                dis.readUnsignedShort() // minor
                return dis.readUnsignedShort() // major
            }
        }
    }
    return -1
}