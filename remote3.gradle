def configApplicationBothDebugAndNoOP(Project project) {
    project.dependencies {
        implementation 'androidx.multidex:multidex:2.0.1'
        implementation 'androidx.appcompat:appcompat:1.2.0'
    }
    project.configurations {
       // all*.exclude group: 'com.davemorrissey.labs', module: 'subsampling-scale-image-view-androidx'
        all {
            resolutionStrategy {
                // force "androidx.sqlite:sqlite-framework:2.1.0"
                //force "com.squareup.okhttp3:okhttp:3.12.12"
                //force "com.squareup.okhttp3:logging-interceptor:3.12.12"
            }
        }
    }
    project.android {
        defaultConfig {
            multiDexEnabled true
        }
    }
}


def hasAddTimeListener = false;


gradle.addProjectEvaluationListener(new ProjectEvaluationListener() {
    @Override
    void beforeEvaluate(Project project) {
    }

    @Override
    void afterEvaluate(Project project, ProjectState projectState) {
        println("---->afterEvaluate:" + project)
        //todo 遗留问题 如果app工程本身apply了 aspectjx插件,那么因为这里的implementation flipper在工程的apply plugin aspectjx之后,
        // 那么里面的okhttp切面无法被插件切入到,必须是在apply 插件之前.
        // 可以选择自己添加依赖到工程的dependencies块里
        assignRepos(project)
        if (project.plugins.findPlugin("com.android.application") != null) {
            // OkHttpClient.Builder 织入依赖 AndroidAOP（network-hook），与 AspectJ/aspectjx 独立
            project.apply plugin: 'android.aop'
            project.androidAopConfig {
                // enabled is false, the aspect no longer works, the default is not written as true
                enabled true
                // `includeKotlin` set to `true` will scan Kotlin and Kotlinx code; the default is `false` if not specified.
                includeKotlin true
                // include does not set all scans by default. After setting, only the code of the set package name will be scanned.
                //include 'Package name of your project', 'Package name of custom module', 'Package name of custom module'
                // exclude is the package excluded during scanning
                // Can exclude kotlin related and improve speed
                exclude 'kotlin.jvm', 'kotlin.internal','kotlinx.coroutines.internal', 'kotlinx.coroutines.android'
                // Exclude packaged entity names
                excludePackaging 'license/NOTICE' , 'license/LICENSE.dom-software.txt' , 'license/LICENSE'

                // verifyLeafExtends Whether to turn on verification leaf inheritance, it is turned on by default. If type = MatchType.LEAF_EXTENDS of @AndroidAopMatchClassMethod is not set, it can be turned off.
                verifyLeafExtends true
                //Disabled by default. Enabled after Build or Packaging, a cut information file will be generated in app/build/tmp/ (cutInfo.json, cutInfo.html)
                cutInfoJson true
            }

            if (!hasAddTimeListener) {
                hasAddTimeListener = true
                gradle.addListener(new CollectTaskTimeListener())
                println("---->gradle.addListener(new CollectTaskTimeListener()):" + project)
            }
            configApplicationBothDebugAndNoOP(project)

            if (useAspectjxInRelease()) {
                project.dependencies {
                    implementation aopWebview
                }
            }


            if (!isRelease()) {
                //添加自定义的监听
                project.dependencies {
                    //implementation('com.github.hss01248:ActivityTaskView:5.0.1')
                    implementation flipper
                    implementation dokit
                    //implementation "com.github.simplepeng.SpiderMan:spiderman:v1.1.8"
                   // implementation "com.github.hss01248.utilcodeEnhance:crash:1.6.0"
                    if (doUseLeakCanaryPlugin()) {
                        implementation leakcanary
                    }
                }
                project.configurations {
                    all*.exclude group: 'me.weishu', module: 'free_reflection'
                    all*.exclude group: 'com.github.hss01248.aop-android', module:'logforaop'
                   // all*.exclude group: 'com.davemorrissey.labs', module: 'subsampling-scale-image-view-androidx'
                    all {
                        resolutionStrategy {
                            // force "androidx.sqlite:sqlite-framework:2.1.0"
                            force "com.squareup.okhttp3:okhttp:3.12.12"
                            force "com.squareup.okhttp3:logging-interceptor:3.12.12"
                            force "com.facebook.flipper:flipper:$flipperVersion"
                        }
                    }
                }
            } else {

                if (openDebuggerForRelease()) {
                    project.dependencies {
                        //implementation flipper
                        implementation chucker
                        implementation httplogging
                        //implementation sslIgnore
                        //implementation urlConnection
                        if (doUseLeakCanaryPlugin()) {
                            implementation leakcanary
                        }
                    }
                }
                project.dependencies {
                    implementation flippernoop
                    api dokitnoop
                }

            }
            project.dependencies {
                if (doChangeAlertDialogToIosStyle()) {
                    implementation aopAlertDialog
                }
            }


            //UnsatisfiedLinkError: couldn't find DSO to load: libfbjni.so
            //todo 判断: 如果(RN)工程本来有依赖 group: 'com.facebook.fbjni', module: 'fbjni-java-only',那么就排除module: 'fbjni'
            //all*.exclude group: 'com.facebook.fbjni', module: 'fbjni'
            //all*.exclude group: 'com.facebook.fbjni', module: 'fbjni-java-only'

            println("---->isLocal():" + isLocal())

            // AOP 已统一为 AndroidAOP（根工程 classpath io.github.flyjingfish:androidaop-plugin），不再应用 AspectJX
            println("flipperUtil: skip AspectJX (migrated to AndroidAOP). flipper_use_aspectjx / hasApplyAspectjx 已不再生效。")
            //dokit插件
        }
    }
})

